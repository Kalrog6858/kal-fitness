<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kal Fit">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Kal Fit</title>
<style>
:root{--bg:#0d0f14;--card:#161a22;--card2:#1e232d;--line:#2a303c;--tx:#eef1f6;--mut:#8b93a3;--acc:#ff7a1a;--acc2:#ffb347;--ok:#3ddc84;--pf:#5cc8ff;--warn:#ffcc4d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 24px}
h1{font-size:27px;margin:2px 0 2px;letter-spacing:-.02em}
h2{font-size:18px;margin:24px 0 8px;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 4px}
p{margin:6px 0}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}
.hero{background:linear-gradient(140deg,#2a1608,#161a22 60%);border-color:#4a2a12}
.pfcard{background:linear-gradient(140deg,#08202d,#161a22 60%);border-color:#14405a}
.btn{appearance:none;border:0;border-radius:13px;padding:13px 16px;font-weight:750;font-size:15px;background:var(--acc);color:#1d0e00;cursor:pointer;width:100%;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.pf{background:var(--pf);color:#00131f}
.btn.sm2{width:auto;padding:9px 14px;font-size:14px}
.btn.danger{background:#3a1515;color:#ff9b9b;border:1px solid #5a2323}
.row{display:flex;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.tile .v{font-size:21px;font-weight:800;letter-spacing:-.02em}
.tile .l{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.chip{display:inline-block;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.chip.acc{color:var(--acc);border-color:#5a3214;background:#26170b}
.chip.pf{color:var(--pf);border-color:#16455f;background:#0b1d28}
.chip.warn{color:var(--warn);border-color:#5a4a14;background:#241e0a}
.note{border-radius:12px;padding:10px 12px;font-size:13px;background:#241e0a;border:1px solid #5a4a14;color:#ffe08a;margin:10px 0}
.note.blue{background:#0b1d28;border-color:#16455f;color:#bfe9ff}
/* nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(13,15,20,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:30}
nav.tabs button{flex:1;max-width:110px;background:none;border:0;color:var(--mut);padding:9px 0 10px;font-size:11px;font-weight:650;font-family:inherit;position:relative}
nav.tabs button.on{color:var(--acc)}
nav.tabs svg{display:block;margin:0 auto 3px;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs .dot{position:absolute;top:7px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--ok);display:none}
nav.tabs .dot.on{display:block}
/* figures */
.fig{width:100%;height:auto;display:block}
.figbox{background:radial-gradient(circle at 50% 42%,#222937,#12161d 75%);border-radius:14px;overflow:hidden}
.fig .b{stroke:#e8ecf2;stroke-linecap:round}
.fig .bf{stroke:#687183;stroke-linecap:round}
.fig .h{stroke:var(--acc);stroke-linecap:round}
.fig .hf{stroke:#9a4f19;stroke-linecap:round}
.fig .bfill{fill:#e8ecf2}.fig .hfill{fill:var(--acc)}
.fig .hd{fill:#e8ecf2}
.fig .fl{stroke:#2e3542;stroke-width:2}
.fig .eqs{stroke:#465063;stroke-linecap:round}
.fig .eqp{fill:#465063}
.fig .pad{fill:#5b657b}
.fig .padl{stroke:#5b657b;stroke-linecap:round}
.fig .padc{fill:#5b657b;stroke:#7c879e;stroke-width:1.5}
.fig .mat{fill:#24324a}
.fig .rail{stroke:#3a4352;stroke-linecap:round}
.fig .belt{stroke:#394254;stroke-linecap:round}
.fig .bar{stroke:#c9ced8;stroke-linecap:round}
.fig .plate{stroke:#7a8498;stroke-linecap:round}
.fig .plate2{fill:#3a4252;stroke:#7a8498;stroke-width:2}
.fig .dbh{stroke:#c9ced8;stroke-linecap:round}
.fig .dbp{fill:#aab2c0}
.fig .dbc{fill:#2a303c}
.fig .cab{stroke:#9aa3b2;stroke-dasharray:3 2}
.fig .rope{stroke:#d9b45b;stroke-linecap:round}
.fig .pul{fill:#1a1f28;stroke:#9aa3b2;stroke-width:2}
.fig .pfc{fill:var(--pf)}
.fig .belly{fill:none;stroke:var(--pf);stroke-width:2}
/* workout */
.exc{padding:0;overflow:hidden}
.exc .figbox{border-radius:0;max-height:230px;display:flex;justify-content:center}
.exc .figbox svg{width:auto;height:230px;max-width:100%}
.exc .inner{padding:12px 14px 14px}
.exn{font-weight:800;font-size:17px;letter-spacing:-.01em}
.ib{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-weight:800;font-size:15px;font-family:inherit}
.hint{font-size:13px;color:var(--mut);margin:8px 0 4px;line-height:1.4}
.hint b{color:var(--acc2)}
.sr{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:12px;margin-top:6px;background:var(--card2);border:1px solid transparent;transition:.2s}
.sr.dn{background:#0f2a1b;border-color:#1d5a37}
.sn{width:24px;height:24px;border-radius:50%;background:#2c3340;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.sr.dn .sn{background:var(--ok);color:#002210}
.in{width:64px;min-width:0;padding:9px 6px;border-radius:9px;border:1px solid #333b49;background:#11151c;color:var(--tx);font-size:16px;font-weight:700;text-align:center;font-family:inherit}
.x{font-size:12.5px;color:var(--mut)}
.grow{flex:1}
.ck{margin-left:auto;flex:none;width:44px;height:38px;border-radius:10px;border:1px solid #3a4250;background:#11151c;color:#5b6475;font-size:19px;font-weight:900;font-family:inherit}
.sr.dn .ck{background:var(--ok);border-color:var(--ok);color:#002210}
.tm{flex:none;height:38px;padding:0 10px;border-radius:10px;border:1px solid #5a3214;background:#26170b;color:var(--acc);font-weight:800;font-family:inherit}
.wtop{position:sticky;top:0;z-index:15;background:rgba(13,15,20,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:-16px -16px 6px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line)}
.prog{height:7px;background:#232935;border-radius:9px;overflow:hidden;margin:7px 0 4px}
.prog>div{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:9px;transition:width .3s}
/* rest bar */
.rest{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));max-width:496px;margin:0 auto;z-index:40;background:#1d222c;border:1px solid #4a2a12;border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.rest .rt{font-size:28px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--acc)}
.hide{display:none!important}
/* lists */
.li{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .figbox{width:78px;height:78px;flex:none}
.li .figbox svg{width:78px;height:78px}
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dchip{flex:1;min-width:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--mut);padding:7px 0 6px;text-align:center;font-family:inherit;font-weight:700;font-size:12px}
.dchip .t{display:block;font-size:10px;font-weight:650;margin-top:1px;opacity:.85}
.dchip.on{border-color:var(--acc);color:var(--tx);background:#26170b}
.dchip.today{box-shadow:inset 0 -3px 0 var(--acc)}
.dchip.done{color:var(--ok)}
.pfthumb{width:104px;height:104px;flex:none}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lib button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 0 8px;color:var(--tx);font-family:inherit;font-weight:700;font-size:13px;text-align:center;overflow:hidden}
.lib .figbox{border-radius:0;margin-bottom:6px}
/* pf dots */
.pfd{display:flex;gap:8px}
.pfdot{width:38px;height:38px;border-radius:50%;border:2px solid #16455f;background:#0b1d28;color:#3d7da0;font-weight:800;font-family:inherit}
.pfdot.on{background:var(--pf);border-color:var(--pf);color:#00131f}
/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#12161d;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;width:100%;max-width:540px;max-height:92vh;overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));position:relative}
.sheet .x2{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:20px;z-index:2;font-family:inherit}
.sheet .figbox svg{max-height:300px}
ol.cues{padding-left:20px;margin:8px 0}
ol.cues li{margin:6px 0}
/* charts */
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:#262c37}.chart .ax{fill:#7d8697;font-size:10.5px}
.chart .cl{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round}
.chart .cd{fill:var(--acc)}
.chart.pfch .cl{stroke:var(--pf)}.chart.pfch .cd{fill:var(--pf)}
.empty{color:var(--mut);font-size:13px;padding:16px 4px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal div{aspect-ratio:1;border-radius:6px;background:#1b2029}
.cal .w{background:var(--acc)}.cal .c{background:#7a4a1c}.cal .p{background:#164a66}.cal .fut{background:transparent;border:1px dashed #252b35}
label.f{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
input.full,select.full{width:100%;padding:11px 10px;border-radius:11px;border:1px solid #333b49;background:#11151c;color:var(--tx);font-size:16px;font-family:inherit}
.seg{display:flex;background:#11151c;border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:8px;border-radius:9px;font-weight:750;font-family:inherit;font-size:14px}
.seg button.on{background:var(--card2);color:var(--tx)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t td{padding:7px 2px;border-top:1px solid var(--line)}
table.t td:last-child{text-align:right;font-weight:750}
.big{font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1}
.gl-lab{font-size:30px;font-weight:900;letter-spacing:.02em;text-align:center;margin-top:8px}
.gl-cnt{font-size:56px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;line-height:1.05}
.del{background:none;border:0;color:#7d8697;font-size:18px;font-family:inherit}
</style>
</head>
<body>
<div class="wrap" id="main"></div>

<div id="rest" class="rest hide">
  <div class="grow"><div class="xs mut" id="restLbl">Rest</div><div class="rt" id="restT">1:30</div></div>
  <button class="btn sec sm2" id="rplus">+15s</button>
  <button class="btn sm2" id="rskip">Skip</button>
</div>

<nav class="tabs" id="tabs">
  <button data-go="today"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Today</button>
  <button data-go="plan"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
  <button data-go="workout"><span class="dot" id="wdot"></span><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12"/></svg>Workout</button>
  <button data-go="progress"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 16l4-5 3 3 6-8"/></svg>Progress</button>
  <button data-go="settings"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>
</nav>

<div id="modal" class="modal hide"></div>

<script>
'use strict';
/* ================= Stick-figure animation engine ================= */
const L={T:46,N:5,HR:9,UA:26,FA:24,TH:36,SH:34,FT:11};
const RAD=a=>a*Math.PI/180;
const mv=(p,l,a)=>[p[0]+Math.cos(RAD(a))*l,p[1]+Math.sin(RAD(a))*l];
const f1=n=>Math.round(n*10)/10;
const pp=p=>f1(p[0])+','+f1(p[1]);
function norm(P){const q=Object.assign({sw:0,hw:0,ft:0,tl:1},P);for(const k of['ua','fa','th','sh','ft','tl'])if(q[k+'2']===undefined)q[k+'2']=q[k];return q;}
function lerp(A,B,s){const o={};for(const k in A)o[k]=A[k]+((B[k]===undefined?A[k]:B[k])-A[k])*s;return o;}
function joints(P){
  const hip=[P.hx,P.hy],sh=mv(hip,L.T,P.t),hd=mv(sh,L.N+L.HR,P.t),nk=mv(sh,L.N,P.t);
  const shN=[sh[0]+P.sw,sh[1]],shF=[sh[0]-P.sw,sh[1]],hpN=[hip[0]+P.hw,hip[1]],hpF=[hip[0]-P.hw,hip[1]];
  const el=mv(shN,L.UA,P.ua),ha=mv(el,L.FA,P.fa),el2=mv(shF,L.UA,P.ua2),ha2=mv(el2,L.FA,P.fa2);
  const kn=mv(hpN,L.TH*P.tl,P.th),an=mv(kn,L.SH,P.sh),to=mv(an,L.FT,P.ft);
  const kn2=mv(hpF,L.TH*P.tl2,P.th2),an2=mv(kn2,L.SH,P.sh2),to2=mv(an2,L.FT,P.ft2);
  return {hip,sh,hd,nk,shN,shF,hpN,hpF,el,ha,el2,ha2,kn,an,to,kn2,an2,to2};
}
const LN=(a,b,c,w)=>`<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" class="${c}"${w?` stroke-width="${w}"`:''}/>`;
const RC=(x,y,w,h,c='eqp',r=3)=>`<rect x="${f1(x)}" y="${f1(y)}" width="${w}" height="${h}" rx="${r}" class="${c}"/>`;
const CI=(p,r,c)=>`<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}" class="${c}"/>`;
function DBL(p,ang=0,len=16){const a=mv(p,-len/2,ang),b=mv(p,len/2,ang);return LN(a,b,'dbh',3)+CI(a,4.4,'dbp')+CI(b,4.4,'dbp');}
const DBE=p=>CI(p,5.6,'dbp')+CI(p,2,'dbc');
const CAB=(a,b)=>LN(a,b,'cab',1.3);
const ROPE=p=>LN([p[0]-4,p[1]+6],p,'rope',2.5)+LN([p[0]+4,p[1]+6],p,'rope',2.5);
const FLOOR='<line x1="4" y1="185" x2="196" y2="185" class="fl"/>';
const MAT=RC(14,182,172,3,'mat',1.5);
const POST=(x,y1,y2)=>LN([x,y1],[x,y2],'eqs',5);

function render(ex,s){
  const P=lerp(ex._A,ex._B,s),j=joints(P),hl=ex.hl||[],fr=P.sw>0;
  const c=(p,far)=>hl.includes(p)?(far&&!fr?'hf':'h'):(far&&!fr?'bf':'b');
  let o=(ex.noFloor?'':FLOOR)+(ex.scene||'');
  if(ex.bx)o+=ex.bx(j,P,s);
  o+=LN(j.hpF,j.kn2,c('th',1),7.5)+LN(j.kn2,j.an2,c('sh',1),7)+LN(j.an2,j.to2,fr?'b':'bf',5);
  if(!fr)o+=LN(j.shF,j.el2,c('ua',1),7)+LN(j.el2,j.ha2,c('fa',1),6.5);
  if(fr){o+=`<path d="M${pp(j.shF)} L${pp(j.shN)} L${pp(j.hpN)} L${pp(j.hpF)} Z" class="${hl.includes('torso')?'hfill':'bfill'}" stroke-linejoin="round"/>`;}
  else o+=LN(j.hip,j.sh,c('torso'),12);
  o+=LN(j.sh,j.nk,'b',5)+CI(j.hd,L.HR,'hd');
  if(fr)o+=LN(j.shF,j.el2,c('ua'),7)+LN(j.el2,j.ha2,c('fa'),6.5);
  o+=LN(j.hpN,j.kn,c('th'),7.5)+LN(j.kn,j.an,c('sh'),7)+LN(j.an,j.to,'b',5);
  o+=LN(j.shN,j.el,c('ua'),7)+LN(j.el,j.ha,c('fa'),6.5);
  if(ex.fx)o+=ex.fx(j,P,s);
  if(ex.belly){const m=mv(j.hip,L.T*.42,P.t),b=mv(m,6,P.t+90);o+=`<ellipse cx="${f1(b[0])}" cy="${f1(b[1])}" rx="11" ry="${f1(1+5*s)}" class="belly"/>`;}
  if(ex.pulse){const[r0,r1]=ex.pulse,r=r0+(r1-r0)*s,op=r1<r0?.3+.55*s:.75-.35*s;o+=`<circle cx="${f1(j.hip[0])}" cy="${f1(j.hip[1])}" r="${f1(r)}" class="pfc" style="opacity:${f1(op*100)/100}"/>`;}
  return o;
}

/* ================= Exercise library ================= */
const STAND={hx:100,hy:112,t:-90,th:90,sh:90,ft:0};
const FRONT={hx:100,hy:112,t:-90,sw:15,hw:8,th:87,th2:93,sh:90,sh2:90,ft:0,ft2:180};
const HOOK={hx:110,hy:176,t:180,th:-60.5,sh:59.4,ft:0,ua:8,fa:4};
const KNEE='Knee-safe: smooth and controlled, no twisting on a bent knee. Stop if you feel pain, clicking, catching or swelling.';
const EX={
 bench:{name:'Dumbbell Bench Press',type:'reps',muscles:'Chest · Front shoulders · Triceps',hl:['torso','ua'],dur:2.8,
  A:{hx:115,hy:124,t:180,th:45,sh:90,ua:75,fa:-90},B:{ua:-80},
  scene:RC(38,129,94,7)+LN([50,136],[50,184],'eqs',4)+LN([120,136],[120,184],'eqs',4),
  fx:j=>DBL(j.ha),
  cues:['Lie flat, feet planted, squeeze your shoulder blades together','Lower the dumbbells slowly to chest level, elbows about 45° from your body','Press up until your arms are straight. Breathe out as you push']},
 pulldown:{name:'Lat Pulldown',type:'reps',muscles:'Lats (back width) · Biceps · Rear shoulders',hl:['ua','torso'],dur:2.8,
  A:{hx:100,hy:146,t:-100,th:0,sh:90,ua:-80,fa:-80},B:{ua:115,fa:-55},
  scene:LN([100,12],[166,12],'eqs',5)+POST(166,12,184)+CI([100,13],4,'pul')+RC(80,151,40,6)+LN([100,157],[100,184],'eqs',4)+RC(127,131,18,8,'pad'),
  bx:j=>CAB([100,13],j.ha),fx:j=>LN([j.ha[0]-24,j.ha[1]],[j.ha[0]+24,j.ha[1]],'bar',3.5),
  cues:['Thighs locked under the pad, chest up, lean back a little','Pull the bar to your upper chest by driving your elbows down','Let it rise slowly until your arms are straight. Don\'t swing']},
 shpress:{name:'Seated Dumbbell Shoulder Press',type:'reps',muscles:'Shoulders · Triceps · Upper chest',hl:['ua'],dur:2.8,
  A:{hx:100,hy:136,t:-90,sw:15,hw:9,tl:.35,th:75,th2:105,sh:90,sh2:90,ft:0,ft2:180,ua:20,fa:-90,ua2:160,fa2:270},B:{ua:-60,fa:-80,ua2:240,fa2:260},
  scene:RC(84,68,32,70,'pad')+RC(76,136,48,8)+LN([84,144],[84,184],'eqs',4)+LN([116,144],[116,184],'eqs',4),

function chart(pts,cls=''){

  const W=340,H=150,l=38,r=12,t=14,b=24;let lo=Math.min(...pts.map(p=>p.y)),hi=Math.max(...pts.map(p=>p.y));if(hi-lo<2){lo-=1;hi+=1;}const pad=(hi-lo)*.12;lo-=pad;hi+=pad;
  const x0=pts[0].x,x1=pts[pts.length-1].x,xr=Math.max(1,x1-x0);const X=x=>l+(x-x0)/xr*(W-l-r),Y=y=>t+(1-(y-lo)/(hi-lo))*(H-t-b);
  let g='';for(let k=0;k<=3;k++){const v=lo+(hi-lo)*k/3;g+=`<line x1="${l}" x2="${W-r}" y1="${f1(Y(v))}" y2="${f1(Y(v))}" class="gl"/><text x="${l-6}" y="${f1(Y(v)+4)}" class="ax" text-anchor="end">${f1(v)}</text>`;}
  const fd=x=>new Date(x).toLocaleDateString(undefined,{month:'short',day:'numeric'});
  return `<svg viewBox="0 0 ${W} ${H}" class="chart ${cls}">${g}<path d="${pts.map((p,k)=>(k?'L':'M')+f1(X(p.x))+','+f1(Y(p.y))).join('')}" class="cl"/>${pts.map(p=>`<circle cx="${f1(X(p.x))}" cy="${f1(Y(p.y))}" r="3.2" class="cd"/>`).join('')}<text x="${l}" y="${H-6}" class="ax">${fd(x0)}</text><text x="${W-r}" y="${H-6}" class="ax" text-anchor="end">${fd(x1)}</text></svg>`;}

function vSettings(){
  return `<h1>More</h1>
  <div class="card"><h3>Gym weight units</h3><div class="seg" style="margin-top:8px"><button data-unit="lb" class="${U()==='lb'?'on':''}">lb</button><button data-unit="kg" class="${U()==='kg'?'on':''}">kg</button></div><p class="xs mut">Body weight is always in kg.</p></div>
  <div class="card"><h3>Pelvic floor hold time</h3><div class="seg" style="margin-top:8px">${[3,5,8,10].map(n=>`<button data-hold="${n}" class="${DB.settings.hold===n?'on':''}">${n}s</button>`).join('')}</div><p class="xs mut">Weeks 1–2: 3–5 s. Weeks 3–6: 8 s. After that: 10 s. If you can't fully relax between reps, go shorter.</p></div>
  <div class="card"><div class="row sp"><h3>Sounds</h3><div class="seg"><button data-sound="1" class="${DB.settings.sound?'on':''}">On</button><button data-sound="0" class="${DB.settings.sound?'':'on'}">Off</button></div></div></div>
  <button class="btn sec" data-go="library">📚 Exercise library (all animations)</button>
  <div class="card"><h3>Backup your data</h3><p class="xs mut">Your log is saved on this phone only. Export a backup now and then so you never lose it.</p><div class="grid2">${window.self!==window.top?'':'<button class="btn sec" id="exp">Download file</button>'}<label class="btn sec" style="text-align:center">Import file<input type="file" id="imp" accept="application/json" hidden></label><button class="btn sec" id="copyB">Copy backup</button><button class="btn sec" id="pasteB">Paste backup</button></div></div>
  <div class="card"><h3>Install on your phone</h3><p class="sm mut"><b>iPhone (Safari):</b> Share → <i>Add to Home Screen</i>.<br><b>Android (Chrome):</b> ⋮ menu → <i>Add to Home screen</i> / <i>Install app</i>.<br>It then opens full-screen like a real app and works offline at the gym.</p></div>
  <div class="card"><h3>Safety</h3><p class="sm mut">This plan is general fitness guidance, not medical advice. Get a doctor or physiotherapist to clear you for training with a knee injury. Stop any exercise that causes sharp pain, and see a doctor if your knee locks, gives way or swells.</p></div>
  <button class="btn danger" id="reset">Reset all data</button>`;}
function vLibrary(){return `<div class="row sp"><h1>Exercise library</h1><button class="btn sec sm2" data-go="settings">Back</button></div><p class="mut sm">Tap any exercise for form tips.</p><div class="lib">${Object.keys(EX).map(id=>`<button data-info="${id}">${fig(id)}${EX[id].name}</button>`).join('')}</div>`;}

/* ================= Modals ================= */
function modal(html){const m=$('#modal');m.innerHTML=`<div class="sheet"><button class="x2" data-close>×</button>${html}</div>`;m.classList.remove('hide');mountFigs(m);}
function closeModal(){const m=$('#modal');m.classList.add('hide');m.innerHTML='';if(GS){clearInterval(GS.iv);GS=null;}}
function info(id){const e=EX[id];modal(`${fig(id)}<h2 style="margin-top:14px">${e.name}</h2><div class="row" style="flex-wrap:wrap;gap:6px"><span class="chip ${e.pf?'pf':'acc'}">${e.muscles}</span>${e.knee?'<span class="chip warn">🦵 knee-safe version</span>':''}</div>
  <ol class="cues">${e.cues.map(c=>`<li>${c}</li>`).join('')}</ol>${e.knee?`<div class="note">${KNEE}</div>`:''}<p class="xs mut">Orange = muscles working. ${e.pf?'Blue circle = pelvic floor: shrinking = squeeze, growing = relax.':''}</p>`);}

function ask(msg,yes,label='Yes'){modal(`<h2 style="margin:26px 40px 6px 0">${msg}</h2><div class="grid2" style="margin-top:16px"><button class="btn sec" data-close>No</button><button class="btn danger" id="askYes">${label}</button></div>`);$('#askYes').onclick=()=>{closeModal();yes();};}
function restore(txt){try{const d=JSON.parse(txt);if(!d||d.v!==1)throw 0;d.settings=Object.assign(blank().settings,d.settings||{});d.pf=d.pf||{};DB=d;save();go('today');modal('<div style="text-align:center;padding:24px 0"><div style="font-size:44px">✅</div><h2>Backup restored</h2></div><button class="btn" data-close>OK</button>');}catch(x){modal('<h2 style="margin-top:24px">That isn\'t a Kal Fit backup.</h2><button class="btn sec" data-close style="margin-top:12px">OK</button>');}}

/* ================= Guided pelvic floor session ================= */
let GS=null;
function guided(){
  const H=DB.settings.hold,ph=[];
  ph.push({st:'Get ready',lab:'LIE DOWN',sub:'Knees bent, feet flat, breathe normally',d:5,s:0,ex:'kegel'});
  for(let k=1;k<=10;k++){ph.push({st:'Pelvic floor holds',lab:'SQUEEZE',sub:'Lift up & in. Keep breathing',d:H,s:1,rep:`${k}/10`,ex:'kegel',f:880});ph.push({st:'Pelvic floor holds',lab:'RELAX',sub:'Let go completely',d:H,s:0,rep:`${k}/10`,ex:'kegel',f:440});}
  ph.push({st:'Next up',lab:'QUICK FLICKS',sub:'Fast squeeze, fast release',d:5,s:0,ex:'flicks'});
  for(let k=1;k<=10;k++){ph.push({st:'Quick flicks',lab:'SQUEEZE',sub:'',d:1,s:1,rep:`${k}/10`,ex:'flicks',f:880});ph.push({st:'Quick flicks',lab:'RELAX',sub:'',d:1.5,s:0,rep:`${k}/10`,ex:'flicks',f:440});}
  ph.push({st:'Next up',lab:'RELAX BREATHING',sub:'Let the muscles drop and soften',d:5,s:0,ex:'breath'});
  for(let k=1;k<=6;k++){ph.push({st:'Relax & drop breathing',lab:'BREATHE IN',sub:'Belly rises, pelvic floor drops',d:4,s:1,rep:`${k}/6`,ex:'breath',f:520});ph.push({st:'Relax & drop breathing',lab:'BREATHE OUT',sub:'Stay soft and relaxed',d:5,s:0,rep:`${k}/6`,ex:'breath',f:390});}
  const total=ph.reduce((a,p)=>a+p.d,0);
  modal(`<div class="figbox" style="max-width:340px;margin:30px auto 0"><svg viewBox="0 0 200 200" class="fig" id="gsvg"></svg></div>
   <div class="mut sm" id="gst" style="text-align:center;margin-top:10px"></div><div class="gl-lab" id="glab"></div><div class="gl-cnt" id="gcnt"></div><div class="mut sm" id="gsub" style="text-align:center;min-height:20px"></div><div class="mut xs" id="grep" style="text-align:center"></div>
   <div class="prog" style="margin:14px 0"><div id="gbar" style="width:0;background:var(--pf)"></div></div>
   <div class="grid2"><button class="btn sec" id="gpause">Pause</button><button class="btn sec" data-close>End</button></div>`);
  GS={ph,i:-1,el:0,last:performance.now(),paused:false,s:0,total,doneT:0};
  GS.iv=setInterval(gTick,80);gTick();}
function gTick(){if(!GS)return;const now=performance.now(),dt=(now-GS.last)/1000;GS.last=now;if(!GS.paused)GS.el+=dt;
  let acc=0,i=0;while(i<GS.ph.length&&acc+GS.ph[i].d<=GS.el){acc+=GS.ph[i].d;i++;}
  if(i>=GS.ph.length){gDone();return;}
  const p=GS.ph[i];if(i!==GS.i){GS.i=i;if(p.f){beep(p.f,.12);vib(p.s?60:25);}}
  const k=p.ex==='breath'?.06:.35;GS.s+=(p.s-GS.s)*k;
  const sv=$('#gsvg');sv.setAttribute('viewBox',p.ex==='flicks'?'0 60 200 135':'0 105 200 92');sv.innerHTML=render(EX[p.ex],GS.s);$('#gst').textContent=p.st;$('#glab').textContent=p.lab;$('#glab').style.color=p.s?'var(--pf)':'var(--tx)';
  $('#gcnt').textContent=Math.ceil(acc+p.d-GS.el);$('#gsub').textContent=p.sub;$('#grep').textContent=p.rep?'Rep '+p.rep:'';$('#gbar').style.width=(GS.el/GS.total*100)+'%';}
function gDone(){clearInterval(GS.iv);GS=null;const t=ds(),a=DB.pf[t]||[0,0,0],k=a.findIndex(x=>!x);if(k>=0)a[k]=1;DB.pf[t]=a;save();vib([100,60,100]);beep(990,.2);
  $('#modal .sheet').innerHTML=`<div style="text-align:center;padding:30px 0 10px"><div style="font-size:52px">✅</div><h1>Session done</h1><p class="mut">${a.filter(Boolean).length} of 3 today</p></div><div class="note blue">Do this 3 times a day. Most people feel a difference after 6–12 weeks of doing it every day.</div><button class="btn pf" data-close>Close</button>`;
  if(VIEW==='today')go('today');}
$('#modal').addEventListener('click',e=>{if(e.target.id==='gpause'&&GS){GS.paused=!GS.paused;e.target.textContent=GS.paused?'Resume':'Pause';}});

/* ================= Events ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-info],[data-plan],[data-go],[data-close]');if(!t)return;
  if(t.hasAttribute('data-close')){closeModal();return;}
  if(t.dataset.go){go(t.dataset.go);return;}
  if(t.dataset.start){startWorkout(t.dataset.start);return;}
  if(t.dataset.plan!==undefined){planDay=+t.dataset.plan;go('plan');return;}
  if(t.dataset.info){info(t.dataset.info);return;}
  if(t.dataset.pf!==undefined){const d=ds(),a=DB.pf[d]||[0,0,0];a[+t.dataset.pf]=a[+t.dataset.pf]?0:1;DB.pf[d]=a;save();go(VIEW);return;}
  if(t.id==='guided'){guided();return;}
  if(t.classList.contains('ck')){toggleSet(t.closest('.sr'));return;}
  if(t.classList.contains('tm')){const row=t.closest('.sr'),sec=+row.querySelector('.r').value||30;beep(880,.1);startRest(sec,'Hold it! 🔥',()=>{if(!row.classList.contains('dn'))toggleSet(row);});return;}
  if(t.id==='finish'||t.id==='finish2'){finish();return;}
  if(t.id==='cancelW'){ask('Cancel this workout? Nothing will be saved.',()=>{DB.active=null;save();stopRest();go('today');},'Cancel workout');return;}
  if(t.dataset.unit){DB.settings.unit=t.dataset.unit;save();go('settings');return;}
  if(t.dataset.hold){DB.settings.hold=+t.dataset.hold;save();go('settings');return;}
  if(t.dataset.sound!==undefined){DB.settings.sound=t.dataset.sound==='1';save();go('settings');return;}
  if(t.dataset.delb){DB.body=DB.body.filter(b=>b.date!==t.dataset.delb);save();go('progress');return;}
  if(t.id==='bSave'){const d=$('#bDate').value||ds(),w=parseFloat($('#bW').value),z=parseFloat($('#bZ').value);if(isNaN(w)&&isNaN(z))return;
    const ex=DB.body.find(b=>b.date===d)||{date:d};if(!isNaN(w))ex.weight=f1(w);if(!isNaN(z))ex.waist=f1(z);if(!DB.body.includes(ex))DB.body.push(ex);save();go('progress');return;}
  if(t.id==='exp'){const b=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kalfit-backup-'+ds()+'.json';document.body.appendChild(a);a.click();a.remove();return;}
  if(t.id==='reset'){ask('Delete ALL workouts, body stats and settings? This cannot be undone.',()=>{DB=blank();save();go('today');},'Delete everything');return;}
  if(t.id==='copyB'){const txt=JSON.stringify(DB);try{navigator.clipboard.writeText(txt).then(()=>{t.textContent='Copied ✓';},()=>{t.textContent='Copy failed';});}catch(x){t.textContent='Copy failed';}return;}
  if(t.id==='pasteB'){modal(`<h2 style="margin-top:18px">Restore a backup</h2><p class="mut sm">Paste the backup text you copied earlier.</p><textarea id="pasteT" class="full" rows="6" style="width:100%;background:#11151c;color:var(--tx);border:1px solid #333b49;border-radius:11px;padding:10px;font-size:13px"></textarea><button class="btn" id="pasteGo" style="margin-top:10px">Restore</button>`);return;}
  if(t.id==='pasteGo'){restore($('#pasteT').value);return;}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.classList.contains('in')&&DB.active){const row=t.closest('.sr'),s=DB.active.log[row.dataset.ex][+row.dataset.k];
    if(t.classList.contains('w'))s.w=fromIn(t.value);else s.r=t.value===''?null:+t.value;save();}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='sSel'){strengthSel=t.value;go('progress');}
  if(t.id==='imp'&&t.files[0]){const r=new FileReader();r.onload=()=>restore(r.result);r.readAsText(t.files[0]);}});

go(location.hash.slice(1)||'today');
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
